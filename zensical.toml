# Zensical configuration for the mkdocs-zip-bundle-plugin demo site.
#
# Build with:  make build
# NOTE: Zensical can't run the MkDocs zip-bundle or placeholder plugins, so the
# build loads the zip-bundle assets directly and post-processes the output with
# `markdown-placeholder-standalone --phase both` to wire up the interactive
# @PLACEHOLDER@ widgets. Running `zensical build` on its own leaves placeholders
# as literal @VAR@ text and omits the generated placeholder assets.

[project]
site_name = "mkdocs-zip-bundle-plugin"
site_url = "https://mkdocs-zip-bundle-plugin.daemonless.io"
site_description = "A MkDocs plugin that turns code blocks into downloadable ZIP bundles or raw files — placeholder-aware."
repo_url = "https://github.com/daemonless/mkdocs-zip-bundle-plugin"
repo_name = "daemonless/mkdocs-zip-bundle-plugin"

extra_css = [
  # zip-bundle (Zensical: load assets directly, no plugin). Copied from the
  # in-repo mkdocs_zip_bundle/assets/ into site/ at build time by the Makefile.
  "assets/zip-bundle/zip-bundle.css",
  # placeholder plugin (generated post-build by markdown-placeholder-standalone)
  "assets/stylesheets/placeholders.css",
]

extra_javascript = [
  # zip-bundle (Zensical: load assets directly, no plugin)
  "assets/zip-bundle/jszip.min.js",
  "assets/zip-bundle/zip-bundle.js",
  # placeholder plugin (generated post-build by markdown-placeholder-standalone)
  "assets/javascripts/placeholder-combined.js",
]

nav = [
  { "Home" = "index.md" },
  { "Configuration" = "configuration.md" },
]

[project.theme]
variant = "modern"
features = [
  # navigation.instant intentionally OFF: the post-build placeholder plugin
  # builds its inputs against the DOM on load; SPA instant nav races the content
  # swap. Full page loads keep the @PLACEHOLDER@ widgets in their correct spot.
  "navigation.tabs",
  "navigation.top",
  "content.code.copy",
  "search.suggest",
]

[project.plugins]
search = {}

# Markdown extensions — attr_list is REQUIRED for zip-bundle to read the
# data-zip-* attributes on code blocks.
[project.markdown_extensions.attr_list]
[project.markdown_extensions.admonition]
[project.markdown_extensions.tables]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
